# Reproducible Postgres for the Thermal Gradient SQL analysis.
# Start with:  docker compose up -d
# Stop with:   docker compose down       (data survives)
# Wipe data:   docker compose down -v    (removes the volume)

services:
  db:
    image: postgres:18 # pinned major version for reproducibility
    container_name: thermal-gradient-db # stable name so exec commands are predictable
    restart: unless-stopped # comes back after a reboot, unless you stopped it
    environment:
      POSTGRES_DB: ${POSTGRES_DB} # values read from .env (gitignored, local)
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # host:container. Connect from VS Code on 5432.
    volumes:
      - pgdata:/var/lib/postgresql # named volume keeps data across restarts
      - ./sql:/sql
      - ./data:/data

volumes:
  pgdata: # declares the named volume used above
